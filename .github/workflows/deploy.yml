name: Build and Deploy to FTP

on:
  push:
    branches:
      - main  # deploy on pushes to the main branch
  workflow_dispatch:

concurrency:
  group: ftp-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify exported output
        run: |
          test -f out/index.html
          test -d out/_next/static
          find out/_next/static -maxdepth 2 -type f | head -n 20

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          log-level: standard
          exclude: |
            **/.git*
            **/.DS_Store
            node_modules/**
